[binaries]
c = toolchain + '/bin/aarch64-linux-android21-clang'
cpp = toolchain + '/bin/aarch64-linux-android21-clang++'
ar = toolchain + '/bin/llvm-ar'
strip = toolchain + '/bin/llvm-strip'

[constants]
#https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2604-Readme.md
ndk_path = '/usr/local/lib/android/sdk/ndk/29.0.14206865'
toolchain = ndk_path + '/toolchains/llvm/prebuilt/linux-x86_64'

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'armv8-a'
endian = 'little'
