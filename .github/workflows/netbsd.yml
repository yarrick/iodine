name: netbsd

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
    contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: make
      uses: vmactions/netbsd-vm@v1.5.2
      with:
        prepare: |
          pkg_add -u check git pkgconf meson python314 py314-pip py314-dns
        run: |
          git config --global --add safe.directory /home/runner/work/iodine/iodine
          meson setup build
          cd build
          ninja
          ninja test
          python3.14 -m pip install ping3 --break-system-packages
          ninja tun_bench
          ninja test_server
