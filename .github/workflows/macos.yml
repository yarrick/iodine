name: macos

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
    contents: read

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
    - name: install deps
      run: brew install check meson
    - name: meson setup
      run: meson setup build
    - name: build
      working-directory: build
      run: ninja
    - name: run tests
      working-directory: build
      run: ninja test
    - name: install ping3
      run: /opt/homebrew/bin/python3 -m pip install ping3 --break-system-packages
    - name: run bench
      working-directory: build
      run: sudo -E ninja tun_bench
    - name: install dnspython
      run: /opt/homebrew/bin/python3 -m pip install dnspython --break-system-packages
    - name: run test_server
      working-directory: build
      run: ninja test_server

  build-android:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
    - name: install deps
      run: brew install meson
    - name: meson setup
      run: meson setup build-android --cross-file .github/macos-android-aarch64.ini
    - name: build
      working-directory: build-android
      run: ninja

  build-windows:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
    - name: install deps
      run: brew install check meson mingw-w64
    - name: meson setup
      run: meson setup build-windows --cross-file .github/mingw-windows-x86_64.ini
    - name: build
      working-directory: build-windows
      run: ninja
