name: windows

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
    contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build UCRT64
            runner: windows-latest
            msystem: UCRT64
            pkg_prefix: mingw-w64-ucrt-x86_64
            bench: true
            package: false

          - name: build CLANG64
            runner: windows-latest
            msystem: CLANG64
            pkg_prefix: mingw-w64-clang-x86_64
            bench: false
            package: true

          - name: build CLANGARM64
            runner: windows-11-arm
            msystem: CLANGARM64
            pkg_prefix: mingw-w64-clang-aarch64
            bench: true
            package: true

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}

    steps:
    - uses: actions/checkout@v7
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: false
        install: >-
          git
          ${{ matrix.pkg_prefix }}-toolchain
          ${{ matrix.pkg_prefix }}-zlib
          ${{ matrix.pkg_prefix }}-meson
          ${{ matrix.pkg_prefix }}-check
          ${{ matrix.pkg_prefix }}-python-pip
          ${{ matrix.pkg_prefix }}-python-dnspython
    - name: meson setup
      run: >-
        meson setup build
        --prefix=C:/ -Dbindir=bin -Dsbindir=bin -Ddocdir=doc -Dwerror=true
    - name: build
      working-directory: build
      run: ninja
    - name: iodine -v
      working-directory: build
      run: ./iodine.exe -v
    - name: iodined -v
      working-directory: build
      run: ./iodined.exe -v
    - name: run tests
      working-directory: build
      run: ninja test
    - name: install ping3
      if: matrix.bench
      run: python3 -m pip install ping3
    - name: run bench
      if: matrix.bench
      working-directory: build
      run: ninja tun_bench
    - name: run test_server
      working-directory: build
      run: ninja test_server
    - name: package
      if: matrix.package
      working-directory: build
      run: ninja package
    - name: upload package
      if: matrix.package
      uses: actions/upload-artifact@v7
      with:
        path: build/iodine-*.zip
        archive: false

  build-android:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.x"
    - name: install meson
      shell: pwsh
      run: |
        pip install -q meson ninja
        refreshenv
    - name: meson setup
      shell: pwsh
      run: >-
        meson setup build-android
        --cross-file .github\windows-android-aarch64.ini
        --prefix=C:/ -Dbindir=bin -Dsbindir=bin -Ddocdir=doc -Dwerror=true
    - name: build
      shell: pwsh
      working-directory: build-android
      run: ninja
