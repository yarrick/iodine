name: bsd

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
    contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: netbsd
            prepare: pkg_add -u check git pkgconf meson
          - os: freebsd
            prepare: pkg install -y devel/check devel/git devel/pkgconf devel/meson
          - os: openbsd
            prepare: pkg_add check git meson

    name: ${{ matrix.os }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: make
      uses: vmactions/${{ matrix.os }}-vm@v1
      with:
        prepare: ${{ matrix.prepare }}
        run: |
          git config --global --add safe.directory /home/runner/work/iodine/iodine
          meson setup build
          cd build
          ninja
          ninja test
