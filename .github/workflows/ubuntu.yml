name: ubuntu

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
    contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            cc: gcc
          - runner: ubuntu-latest
            cc: clang
          - runner: ubuntu-26.04-arm
            cc: gcc
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v7
    - name: apt update
      run: sudo apt update
    - name: install base deps
      run: >-
        sudo apt install -y
        meson ninja-build
        check
        python3-dnspython
    - name: build and test without optional libs
      env:
        CC: ${{ matrix.cc }}
      run: |
        meson setup build-minimal -Dunit_tests=enabled
        ninja -C build-minimal
        build-minimal/iodine -v
        build-minimal/iodined -v
        ninja -C build-minimal test
        ninja -C build-minimal test_server
    - name: install optional deps
      run: >-
        sudo apt install -y
        libselinux1-dev
        libsystemd-dev
        libcap-ng-dev
    - name: build and test all feature combinations
      env:
        CC: ${{ matrix.cc }}
      run: |
        for selinux in enabled disabled; do
          for systemd in enabled disabled; do
            for capng in enabled disabled; do
              dir="build-${selinux}-${systemd}-${capng}"
              echo "Setup selinux=${selinux} systemd=${systemd} libcapng=${capng}"
              meson setup "$dir" \
                -Dselinux="$selinux" \
                -Dsystemd="$systemd" \
                -Dlibcapng="$capng" \
                -Dunit_tests=enabled
              ninja -C "$dir"
              "$dir/iodine" -v
              "$dir/iodined" -v
              ninja -C "$dir" test
            done
          done
        done

  build-android:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: apt update
      run: sudo apt update
    - name: install deps
      run: sudo apt install meson ninja-build
    - name: meson setup
      run: meson setup build-android --cross-file .github/ubuntu-android-aarch64.ini
    - name: build
      working-directory: build-android
      run: ninja

  build-windows:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: apt update
      run: sudo apt update
    - name: install deps
      run: sudo apt install meson ninja-build mingw-w64 mingw-w64-tools libz-mingw-w64-dev
    - name: meson setup
      run: meson setup build-windows --cross-file .github/mingw-windows-x86_64.ini
    - name: build
      working-directory: build-windows
      run: ninja

  tunnel_bench:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: apt update
      run: sudo apt update
    - name: install deps
      run: >-
        sudo apt install -y
        meson ninja-build
    - name: install ping3
      run: sudo python3 -m pip install ping3 --break-system-packages
    - name: meson setup
      run: meson setup build
    - name: run bench
      working-directory: build
      run: sudo ninja tun_bench

  fuzz_server:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: apt update
      run: sudo apt update
    - name: install deps
      run: >-
        sudo apt install -y
        meson ninja-build afl++
    - name: meson setup
      env:
        CC: afl-cc
      run: >-
        meson setup build
        -Db_sanitize=address,undefined
        -Db_lundef=false
        -Dc_args=-fno-sanitize-recover=all
    - name: build
      working-directory: build
      run: ninja tests/fuzz_server
    - name: fuzz
      env:
        AFL_BENCH_UNTIL_CRASH: "1"
        AFL_NO_UI: "1"
        AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
        AFL_SKIP_CPUFREQ: "1"
      run: |
        afl-fuzz -V 180 -i tests/fuzz/server_input/ -o fuzzed -- ./build/tests/fuzz_server
        cat fuzzed/default/fuzzer_stats
        if ! grep -q '^saved_crashes *: 0$' fuzzed/default/fuzzer_stats; then
          for f in fuzzed/default/crashes/id:*; do
            echo "=== Crash input: $f ==="
            cat -v "$f"
            echo
            echo "=== Reproducing: $f ==="
            ./build/tests/fuzz_server "$f" || true
          done
          exit 1
        fi
