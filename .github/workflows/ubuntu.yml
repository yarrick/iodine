name: ubuntu

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
    contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest]
        selinux: [libselinux1-dev, ""]
        systemd: [libsystemd-dev, ""]
        capng: [libcap-ng-dev, ""]
        include:
          - runner: ubuntu-26.04-arm
            selinux: libselinux1-dev
            systemd: libsystemd-dev
            capng: libcap-ng-dev
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v7
    - name: apt update
      run: sudo apt update
    - name: install deps
      run: >-
        sudo apt install -y
        meson ninja-build
        check
        python3-dnspython
        ${{ matrix.selinux }}
        ${{ matrix.systemd }}
        ${{ matrix.capng }}
    - name: meson setup
      run: meson setup build
    - name: build
      working-directory: build
      run: ninja
    - name: iodine -v
      working-directory: build
      run: ./iodine -v
    - name: iodined -v
      working-directory: build
      run: ./iodined -v
    - name: run tests
      working-directory: build
      run: ninja test
    - name: run test_server
      working-directory: build
      run: ninja test_server

  build-android:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: apt update
      run: sudo apt update
    - name: install deps
      run: sudo apt install meson ninja-build
    - name: meson setup
      run: meson setup build-android --cross-file .github/ubuntu-android-aarch64.ini
    - name: build
      working-directory: build-android
      run: ninja

  build-windows:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: apt update
      run: sudo apt update
    - name: install deps
      run: sudo apt install meson ninja-build mingw-w64 mingw-w64-tools libz-mingw-w64-dev
    - name: meson setup
      run: meson setup build-windows --cross-file .github/mingw-windows-x86_64.ini
    - name: build
      working-directory: build-windows
      run: ninja

  tunnel_bench:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: apt update
      run: sudo apt update
    - name: install deps
      run: >-
        sudo apt install -y
        meson ninja-build
    - name: install ping3
      run: sudo python3 -m pip install ping3 --break-system-packages
    - name: meson setup
      run: meson setup build
    - name: run bench
      working-directory: build
      run: sudo ninja tun_bench

  fuzz_server:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: apt update
      run: sudo apt update
    - name: install deps
      run: >-
        sudo apt install -y
        meson ninja-build afl++
    - name: meson setup
      env:
        CC: afl-cc
      run: >-
        meson setup build
        -Db_sanitize=address,undefined
        -Db_lundef=false
        -Dc_args=-fno-sanitize-recover=all
    - name: build
      working-directory: build
      run: ninja tests/fuzz_server
    - name: fuzz
      env:
        AFL_BENCH_UNTIL_CRASH: "1"
        AFL_NO_UI: "1"
        AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
        AFL_SKIP_CPUFREQ: "1"
      run: |
        afl-fuzz -V 180 -i tests/fuzz/server_input/ -o fuzzed -- ./build/tests/fuzz_server
        cat fuzzed/default/fuzzer_stats
        if ! grep -q '^saved_crashes *: 0$' fuzzed/default/fuzzer_stats; then
          for f in fuzzed/default/crashes/id:*; do
            echo "=== Crash input: $f ==="
            cat -v "$f"
            echo
            echo "=== Reproducing: $f ==="
            ./build/tests/fuzz_server "$f" || true
          done
          exit 1
        fi
