name: haiku

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
    contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: make
      uses: vmactions/haiku-vm@v1
      with:
        prepare: pkgman install -y meson check_devel
        run: |
          git config --global --add safe.directory /boot/home/runner/work/iodine/iodine
          meson setup build
          cd build
          ninja
          ninja test
          python3 -m ensurepip
          python3 -m pip install ping3
          ifconfig tun/0 up
          ninja tun_bench
          python3 -m pip install dnspython
          ninja test_server
