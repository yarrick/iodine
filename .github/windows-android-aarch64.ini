[binaries]
c = toolchain + '/bin/aarch64-linux-android21-clang'
cpp = toolchain + '/bin/aarch64-linux-android21-clang++'
ar = toolchain + '/bin/llvm-ar'
strip = toolchain + '/bin/llvm-strip'

[constants]
#https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-VS2026-Readme.md
ndk_path = '/c/Android/android-sdk/ndk/27.3.13750724'
toolchain = ndk_path + '/toolchains/llvm/prebuilt/windows-x86_64'

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'armv8-a'
endian = 'little'
